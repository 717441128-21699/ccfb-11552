<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}矢量切片生产线{% endblock %}</title>
<style>
  :root { --line:#d8dee4; --bg:#f6f8fa; --ink:#1f2328; --accent:#0969da; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif; color:var(--ink); background:var(--bg); }
  nav { background:#24292f; padding:0 20px; display:flex; gap:4px; }
  nav a { color:#fff; text-decoration:none; padding:12px 16px; display:block; }
  nav a:hover, nav a.active { background:var(--accent); }
  main { padding:20px; max-width:1200px; margin:0 auto; }
  h1 { font-size:20px; } h2 { font-size:16px; margin-top:24px; }
  table { border-collapse:collapse; width:100%; background:#fff; }
  th, td { border:1px solid var(--line); padding:6px 10px; text-align:left; }
  th { background:#f0f3f6; }
  form.card, .card { background:#fff; border:1px solid var(--line); border-radius:6px; padding:16px; margin-bottom:16px; }
  label { display:inline-block; min-width:90px; }
  input, select, textarea { padding:5px 8px; border:1px solid var(--line); border-radius:4px; font:inherit; }
  button, .btn { background:var(--accent); color:#fff; border:0; border-radius:6px; padding:7px 18px; cursor:pointer; font:inherit; }
  .muted { color:#57606a; } .ok { color:#1a7f37; } .warn { color:#bf8700; } .err { color:#cf222e; }
  .map { width:100%; height:520px; border:1px solid var(--line); border-radius:6px; }
  code { background:#eff1f3; padding:1px 5px; border-radius:4px; }
</style>
{% block head %}{% endblock %}
</head>
<body>
<nav>
  <a href="/layers">图层登记</a>
  <a href="/tasks">切片任务</a>
  <a href="/preview">瓦片预览</a>
  <a href="/style">样式检查</a>
  <a href="/diff">版本对比</a>
</nav>
<main>
{% block body %}{% endblock %}
</main>
</body>
</html>
